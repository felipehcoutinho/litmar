[project]
name = "litmar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Roberto Bada", email = "roberto@sapereia.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.5.0",
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.8.2",
    "langchain-google-genai>=4.5.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
litmar = "litmar:main"

[project.optional-dependencies]
ui = [
    "streamlit>=1.67.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "streamlit>=1.67.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/W: estilo (pycodestyle) · F: errores (pyflakes) · I: orden de imports
# UP: sintaxis moderna de Python · B: errores típicos (bugbear)
select = ["E", "W", "F", "I", "UP", "B"]
